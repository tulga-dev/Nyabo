[project]
name = "nyabo_mn"
authors = [{ name = "Nyabo", email = "hello@nyabo.mn" }]
description = "Нябо — AI bookkeeping for Mongolian SMEs on ERPNext v16 + Telegram"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
# Pins checked on PyPI 2026-09-08 by the LLM-layer author; Frappe v16 ships openpyxl, jinja2, requests.
dependencies = ["openai==3.8.0", "anthropic==1.4.0", "pydantic>=2.6,<3"]

[project.optional-dependencies]
test = ["pytest", "ruff", "openpyxl", "jinja2"]
pos = ["ebarimt-pos-sdk==0.4.1"]
qr = ["pyzbar", "Pillow"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Read by bench / Frappe Cloud to check framework compatibility.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["nyabo_mn/public", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "W191"]  # tabs are the Frappe convention

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
